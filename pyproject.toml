[project]
name = "vocalis-ai"
version = "0.1.0"
description = "Asistente de voz y texto en tiempo real para aprender inglés técnico"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.1",
    "groq>=0.5.0",
    "edge-tts>=6.1.11",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-select = ["I"] # Ordenar imports automáticamente

[tool.mypy]
strict = true
ignore_missing_imports = true